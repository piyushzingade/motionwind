name: Contributor task proposal
description: Suggest a bounded task suitable for a first contribution.
labels: [good first issue, needs-triage]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the expected behavior, likely package, and acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Ready for a new contributor
      options:
        - label: The task has a clear owner-independent acceptance test.
          required: true
        - label: The task does not require private infrastructure or credentials.
          required: true
